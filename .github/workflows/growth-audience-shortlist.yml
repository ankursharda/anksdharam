name: Growth Agent - Channel Audience Shortlist
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1' # Monday 10:00 IST

permissions:
  contents: read

jobs:
  shortlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rank competitor channels for mythology audience relevance
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 growth-agents/audience_shortlist.py
      - name: Upload shortlist for review
        uses: actions/upload-artifact@v4
        with:
          name: channel-audience-shortlist
          path: |
            growth-agents/output/channel-audience-shortlist.md
            growth-agents/output/channel-audience-shortlist.json
          retention-days: 90
