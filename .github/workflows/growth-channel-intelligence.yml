name: Anks Dharam Whole-Channel Growth Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *' # Daily 09:45 IST
permissions:
  contents: write
concurrency:
  group: anks-upload-growth-pipeline
  cancel-in-progress: false
jobs:
  discover-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Catalog entire public YouTube library and rank opportunities
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python growth-agents/channel_growth_engine.py
      - name: Generate complete cross-platform distribution plan
        run: python growth-agents/channel_distribution_plan.py
      - name: Select one unpromoted public video and publish to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python growth-agents/rotate_instagram_promotions.py
      - name: Publish one ranked video to each authorized Facebook Page
        env:
          FACEBOOK_ANKURS_PAGE_ID: ${{ secrets.FACEBOOK_ANKURS_PAGE_ID }}
          FACEBOOK_ANKURS_PAGE_TOKEN: ${{ secrets.FACEBOOK_ANKURS_PAGE_TOKEN }}
          FACEBOOK_GEETA_PAGE_ID: ${{ secrets.FACEBOOK_GEETA_PAGE_ID }}
          FACEBOOK_GEETA_PAGE_TOKEN: ${{ secrets.FACEBOOK_GEETA_PAGE_TOKEN }}
        run: python growth-agents/rotate_facebook_promotions.py
      - name: Publish one Pinterest Pin when explicitly enabled
        env:
          PINTEREST_PUBLISH_ENABLED: ${{ vars.PINTEREST_PUBLISH_ENABLED }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
        run: python growth-agents/rotate_pinterest_promotions.py
      - name: Track Pinterest performance for confirmed Pins
        if: always()
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python growth-agents/track_pinterest_performance.py
      - name: Persist confirmed Instagram promotions
        if: always()
        run: |
          git config user.name "Anks Dharam Growth Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in growth-agents/instagram-published.json growth-agents/facebook-published.json growth-agents/pinterest-published.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Track confirmed social promotions [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Save full library and growth opportunities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-channel-growth-intelligence
          path: |
            growth-agents/channel-catalog.json
            growth-agents/output/channel-growth-report.md
            growth-agents/output/channel-growth-opportunities.json
            growth-agents/output/channel-distribution-plan.json
            growth-agents/output/pinterest-tracking.json
          retention-days: 30
