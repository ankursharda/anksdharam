name: YouTube Comment Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 3' # Wednesday 10:30 IST
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze public comments on own and external channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 growth-agents/comment_intelligence.py
      - name: Upload two-source report
        uses: actions/upload-artifact@v4
        with:
          name: comment-intelligence
          path: |
            growth-agents/output/comment-intelligence.md
            growth-agents/output/comment-intelligence.json
          retention-days: 30
