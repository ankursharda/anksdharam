name: Unified YouTube Audience Research
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Monday 09:30 IST

permissions:
  contents: read

concurrency:
  group: unified-audience-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Research 27 external channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 growth-agents/competitor_intelligence.py
      - name: Rank relevant mythology audiences
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 growth-agents/audience_shortlist.py
      - name: Research own and external public comments
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 growth-agents/comment_intelligence.py
      - name: Upload combined research reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unified-audience-research
          path: |
            growth-agents/output/competitor-intelligence.md
            growth-agents/output/competitor-intelligence.json
            growth-agents/output/channel-audience-shortlist.md
            growth-agents/output/channel-audience-shortlist.json
            growth-agents/output/comment-intelligence.md
            growth-agents/output/comment-intelligence.json
          if-no-files-found: warn
          retention-days: 90
