name: Anks Dharam New Upload Growth Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Daily 10:30 IST
permissions:
  contents: write
concurrency:
  group: anks-upload-growth-pipeline
  cancel-in-progress: false
jobs:
  detect-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Detect new public uploads and prepare promotion packs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python growth-agents/upload_monitor.py
      - name: Prepare Instagram previews for all new uploads
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          queue = json.loads(Path("growth-agents/output/instagram-new-uploads.json").read_text())
          for item in queue:
              subprocess.run(["python", "growth-agents/instagram_thumbnail_post.py",
                              "--video-id", item["video_id"], "--title", item["title"]], check=True)
          print(f"Prepared {len(queue)} Instagram previews; no posts published.")
          PY
      - name: Persist upload monitor state
        run: |
          git config user.name "Anks Dharam Growth Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-agents/upload-monitor-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update detected Anks Dharam uploads [skip ci]"
            git push
          fi
      - name: Save promotion drafts
        uses: actions/upload-artifact@v4
        with:
          name: latest-upload-promotion-drafts
          path: |
            growth-agents/output/weekly-upload-promotion.md
            growth-agents/output/instagram-new-uploads.json
          retention-days: 90
