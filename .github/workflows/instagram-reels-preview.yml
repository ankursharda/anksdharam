name: Instagram Reels Preview Builder
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST (UTC+05:30)
permissions:
  contents: write
concurrency:
  group: anks-instagram-reels-preview
  cancel-in-progress: false
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Build 30-second Reel preview from Drive (no publishing)
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python growth-agents/build_drive_reel_preview.py
      - name: Persist generated-pair history
        run: |
          git config user.name "Anks Dharam Reels Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-agents/reels-generated-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Track generated Reel combination [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Save preview video
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel-preview
          path: reels-preview/
          retention-days: 7
