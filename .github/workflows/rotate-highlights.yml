name: Rotate Anks Dharam Highlights

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Select two curated posts
        run: python3 rotate_posts.py
      - name: Publish only posts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Rotate two curated Anks Dharam highlights"
            git push
          fi
